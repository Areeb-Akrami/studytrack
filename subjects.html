<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects - StudyTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script type="module">
        import { auth, db, doc, collection, addDoc, getDocs, updateDoc, deleteDoc, query, where, signOut, onAuthStateChanged } from './js/firebase-config.js';

        // Global variables available to window for inline onclick handlers (if any)
        // Since we are in a module, we need to attach functions to window explicitly if they are called from HTML attributes

        let currentUser = null;
        let subjects = [];
        let currentEditingSubject = null;

        document.addEventListener('DOMContentLoaded', initializePage);

        function initializePage() {
            // Check auth state
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    console.log('User authenticated:', currentUser.email);

                    const welcomeMessage = document.getElementById('welcome-message');
                    if (welcomeMessage) {
                        const userName = currentUser.displayName || currentUser.email.split('@')[0];
                        welcomeMessage.textContent = `Welcome, ${userName}`;
                        welcomeMessage.style.display = 'block';
                    }

                    loadSubjects();
                } else {
                    window.location.href = 'login.html';
                }
            });

            setupEventListeners();
        }

        function setupEventListeners() {
            // Mobile menu
            const menuToggle = document.querySelector('.menu-toggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function () {
                    const navLinks = document.querySelector('.nav-links');
                    if (navLinks) navLinks.classList.toggle('active');
                });
            }

            // Logout
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function () {
                    try {
                        await signOut(auth);
                        // Redirect handled by onAuthStateChanged
                    } catch (error) {
                        console.error('Error during logout:', error);
                        showMessage('Failed to log out.', 'error');
                    }
                });
            }

            // Forms
            const addSubjectForm = document.getElementById('add-subject-form');
            if (addSubjectForm) {
                addSubjectForm.addEventListener('submit', handleAddSubject);
            }

            const editSubjectForm = document.getElementById('edit-subject-form');
            if (editSubjectForm) {
                editSubjectForm.addEventListener('submit', handleUpdateSubject);
            }

            // Modal closing
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeAllModals();
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeAllModals();
            });
        }

        function showMessage(message, type = 'info') {
            const container = document.getElementById('message-container');
            if (!container) return;

            const msgElement = document.createElement('div');
            msgElement.className = `message ${type}-message`;

            let icon = 'fa-info-circle';
            if (type === 'success') icon = 'fa-check-circle';
            if (type === 'error') icon = 'fa-exclamation-circle';
            if (type === 'warning') icon = 'fa-exclamation-triangle';

            msgElement.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;

            container.appendChild(msgElement);

            setTimeout(() => {
                msgElement.style.opacity = '0';
                setTimeout(() => msgElement.remove(), 300);
            }, 5000);
        }

        async function loadSubjects() {
            try {
                if (!currentUser) return;

                const q = query(collection(db, 'subjects'), where('userId', '==', currentUser.uid));
                const querySnapshot = await getDocs(q);

                subjects = [];
                querySnapshot.forEach((doc) => {
                    subjects.push({ id: doc.id, ...doc.data() });
                });

                displaySubjects();
            } catch (error) {
                console.error('Error loading subjects:', error);
                showMessage('Failed to load subjects.', 'error');
            }
        }

        function displaySubjects() {
            const container = document.getElementById('subjects-grid');
            if (!container) return;

            container.innerHTML = '';

            if (subjects.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book"></i>
                        <p>No subjects found. Add your first subject to get started!</p>
                    </div>
                `;
                return;
            }

            subjects.forEach(subject => {
                const subjectElement = document.createElement('div');
                subjectElement.className = 'subject-card';

                // Escape HTML to prevent XSS
                const safeName = escapeHtml(subject.name);
                const safeDesc = escapeHtml(subject.description || '');

                subjectElement.innerHTML = `
                    <div class="subject-header">
                        <h3 class="subject-name">${safeName}</h3>
                    </div>
                    <div class="subject-description">${safeDesc}</div>
                    <div class="subject-actions">
                        <button class="btn btn-edit" data-id="${subject.id}">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-delete" data-id="${subject.id}">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;

                // Add event listeners directly to buttons to avoid global scope issues
                const editBtn = subjectElement.querySelector('.btn-edit');
                editBtn.addEventListener('click', () => openEditModal(subject));

                const deleteBtn = subjectElement.querySelector('.btn-delete');
                deleteBtn.addEventListener('click', () => deleteSubject(subject.id));

                container.appendChild(subjectElement);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function handleAddSubject(event) {
            event.preventDefault();
            const nameInput = document.getElementById('subject-name');
            const descInput = document.getElementById('subject-description');
            const btn = document.getElementById('add-subject-btn');

            if (!nameInput.value) {
                showMessage('Please enter a subject name', 'error');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

                const docRef = await addDoc(collection(db, 'subjects'), {
                    userId: currentUser.uid,
                    name: nameInput.value,
                    description: descInput.value,
                    createdAt: new Date().toISOString()
                });

                showMessage('Subject added successfully!', 'success');
                document.getElementById('add-subject-form').reset();
                loadSubjects(); // Reload to show new subject
            } catch (error) {
                console.error('Error adding subject:', error);
                showMessage('Failed to add subject.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus"></i> Add Subject';
            }
        }

        function openEditModal(subject) {
            currentEditingSubject = subject;
            document.getElementById('edit-subject-name').value = subject.name;
            document.getElementById('edit-subject-description').value = subject.description || '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        async function handleUpdateSubject(event) {
            event.preventDefault();
            if (!currentEditingSubject) return;

            const nameInput = document.getElementById('edit-subject-name');
            const descInput = document.getElementById('edit-subject-description');

            try {
                const subjectRef = doc(db, 'subjects', currentEditingSubject.id);
                await updateDoc(subjectRef, {
                    name: nameInput.value,
                    description: descInput.value
                });

                showMessage('Subject updated successfully!', 'success');
                closeAllModals();
                loadSubjects();
            } catch (error) {
                console.error('Error updating subject:', error);
                showMessage('Failed to update subject.', 'error');
            }
        }

        async function deleteSubject(subjectId) {
            if (!confirm('Are you sure you want to delete this subject? This action cannot be undone.')) return;

            try {
                await deleteDoc(doc(db, 'subjects', subjectId));
                showMessage('Subject deleted successfully!', 'success');
                loadSubjects();
            } catch (error) {
                console.error('Error deleting subject:', error);
                showMessage('Failed to delete subject.', 'error');
            }
        }

        function closeAllModals() {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(m => m.style.display = 'none');
            currentEditingSubject = null;
        }

        // Attach close function to window so the HTML onclick works for close buttons if they exist
        window.closeAllModals = closeAllModals;
        window.closeEditModal = closeAllModals;

    </script>
    <style>
        :root {
            --primary: #7C4DFF;
            --primary-dark: #651FFF;
            --secondary: #00E676;
            --danger: #FF1744;
            --warning: #FFAB00;
            --info: #00B0FF;
            --success: #00C853;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --bg-light: #f8f9ff;
            --white: #ffffff;
            --shadow-sm: 0 2px 4px rgba(124, 77, 255, 0.1);
            --shadow-md: 0 4px 6px rgba(124, 77, 255, 0.15);
            --shadow-lg: 0 10px 20px rgba(124, 77, 255, 0.2);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --gradient-primary: linear-gradient(135deg, #7C4DFF, #651FFF);
            --gradient-secondary: linear-gradient(135deg, #00E676, #00C853);
            --gradient-danger: linear-gradient(135deg, #FF1744, #D50000);
            --gradient-card1: linear-gradient(135deg, #FF6B6B, #FF1744);
            --gradient-card2: linear-gradient(135deg, #00B0FF, #2979FF);
            --gradient-card3: linear-gradient(135deg, #FFAB00, #FF6D00);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-light);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 0% 0%, rgba(124, 77, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(0, 230, 118, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 176, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(255, 171, 0, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .navbar {
            background: var(--gradient-primary);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .logo i {
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .logo:hover i {
            transform: scale(1.2) rotate(360deg);
            transition: transform 0.5s ease;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-100%) rotate(45deg);
            transition: transform 0.3s ease;
        }

        .nav-links a:hover::before {
            transform: translateX(100%) rotate(45deg);
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-links a.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page-title {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 2rem;
            color: var(--text-primary);
            position: relative;
            display: inline-block;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 8s linear infinite;
            background-size: 200% 200%;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(135deg, rgba(124, 77, 255, 0.1) 0%, transparent 50%),
                linear-gradient(45deg, rgba(0, 230, 118, 0.1) 0%, transparent 50%);
            z-index: 0;
        }

        .card>* {
            position: relative;
            z-index: 1;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .subject-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-primary);
            opacity: 0.8;
            transition: height 0.3s ease;
        }

        .subject-card:hover::before {
            height: 100%;
            opacity: 0.05;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .subject-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .subject-description {
            color: var(--text-secondary);
            margin: 1rem 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .subject-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            background: var(--gradient-primary);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn:hover::before {
            transform: translateX(100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn.edit {
            background: var(--gradient-secondary);
        }

        .btn.delete {
            background: var(--gradient-danger);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(124, 77, 255, 0.2);
            border-radius: var(--radius-sm);
            background: var(--white);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.1);
        }

        .message {
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            margin: 1rem auto;
            max-width: 1200px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            background-color: rgba(255, 23, 68, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .warning-message {
            background-color: rgba(255, 171, 0, 0.1);
            color: var(--warning);
            border-left: 4px solid var(--warning);
        }

        .success-message {
            background-color: rgba(0, 230, 118, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            position: relative;
            animation: slideInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-10px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .nav-links {
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: var(--gradient-primary);
                padding: 1rem;
                flex-direction: column;
                gap: 10px;
                transform: translateY(-150%);
                transition: transform 0.3s ease;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            .nav-links.active {
                transform: translateY(0);
            }

            .menu-toggle {
                display: block !important;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="fas fa-graduation-cap"></i>
            StudyTrack
        </a>
        <button class="menu-toggle" aria-label="Toggle navigation"
            style="display:none; background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Dashboard</a>
            <a href="subjects.html" class="active">Subjects</a>
            <a href="attendance.html">Attendance</a>
            <a href="settings.html">Settings</a>
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </nav>

    <div id="message-container"></div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 class="page-title">Manage Subjects</h1>
            <div id="welcome-message" style="display:none; font-weight: 500; color: var(--primary);"></div>
        </div>

        <div class="card">
            <h2>Add New Subject</h2>
            <form id="add-subject-form" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="subject-name">Subject Name</label>
                    <input type="text" id="subject-name" placeholder="e.g. Mathematics" required>
                </div>
                <div class="form-group">
                    <label for="subject-description">Description (Optional)</label>
                    <textarea id="subject-description" rows="3" placeholder="Enter subject description..."></textarea>
                </div>
                <button type="submit" id="add-subject-btn" class="btn">
                    <i class="fas fa-plus"></i> Add Subject
                </button>
            </form>
        </div>

        <div id="subjects-grid" class="subjects-grid">
            <!-- Subjects will be loaded here -->
            <div style="text-align: center; grid-column: 1/-1; padding: 2rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Edit Subject</h2>
            <form id="edit-subject-form">
                <div class="form-group">
                    <label for="edit-subject-name">Subject Name</label>
                    <input type="text" id="edit-subject-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-subject-description">Description</label>
                    <textarea id="edit-subject-description" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn">Save Changes</button>
                    <button type="button" class="btn delete" onclick="closeAllModals()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
